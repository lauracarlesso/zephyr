# Opt-in XIP (SMIF) encryption for an application chain-loaded by MCUboot.
#
# Apply on top of kit_pse84_eval_slot.conf, e.g.:
#
#   west build -b kit_pse84_eval/pse846gps2dbzc4a/m33 <app> -d build_cm33s \
#       -- -DEXTRA_CONF_FILE="\
#           $ZEPHYR_BASE/boards/infineon/kit_pse84_eval/kit_pse84_eval_slot.conf;\
#           $ZEPHYR_BASE/boards/infineon/kit_pse84_eval/kit_pse84_eval_xip_enc.conf"
#
# The MCUboot bootloader must be built with
# boards/kit_pse84_eval_pse846gps2dbzc4a_m33_xip_enc.conf (CONFIG_BOOT_ENCRYPT_IMAGE_XIP).

# Encrypt the image with imgtool --encrypt-xip against its slot0 XIP address.
CONFIG_PSE84_MCUBOOT_XIP_ENCRYPTION=y

# ECIES-P256 public key that wraps the per-image AES key. Must match the
# bootloader's CONFIG_BOOT_ENCRYPTION_KEY_FILE private key. Replace the sample
# key with your own before shipping.
CONFIG_PSE84_MCUBOOT_XIP_ENC_KEY_FILE="enc-ec256-pub.pem"

# Encrypted XIP images must be signed (the bootloader verifies the ciphertext
# before loading the AES key). Produce a signed image with an EC256 key instead
# of the unsigned image the slot.conf default generates. Replace the sample key.
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=n
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="root-ec-p256.pem"
